<!doctype html><title>Crossfire landscape play checks</title><style>body{background:#17241f;color:#eee;font:14px system-ui}button{padding:10px}iframe{width:844px;height:390px}pre{white-space:pre-wrap}</style><button id="run">Run landscape play checks</button><pre id="results">Ready</pre><iframe title="Landscape phone tabletop"></iframe><script type="module">
import * as E from './engine.js';import {save,load} from './storage.js';
const f=document.querySelector('iframe'),out=document.querySelector('pre'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))),pause=ms=>new Promise(r=>setTimeout(r,ms));
const unit=(id,side,x,y,extra={})=>({id,side,x,y,type:'rifle',platoon:1,facing:side?180:0,quality:'regular',bonus:0,status:'ready',hidden:false,noFire:false,nation:'german',prone:false,dead:false,...extra});
function fixture(){const s=E.newGame({mode:'hotseat',autoRoll:true,seed:1});s.terrain=[];s.units=[unit('a',0,150,250),unit('a2',0,150,290),unit('pc',0,150,330,{type:'pc',bonus:1}),unit('b',1,800,250,{noFire:true})];return s;}
const d=()=>f.contentDocument,w=()=>f.contentWindow,click=q=>d().querySelector(q).click(),select=(id,shift=false)=>d().querySelector(`[data-unit="${id}"]`).dispatchEvent(new(w().MouseEvent)('click',{bubbles:true,detail:0,shiftKey:shift})),pointer=(type,x,y,id=70,node=d().querySelector('.map-viewport'),primary=true)=>node.dispatchEvent(new(w().PointerEvent)(type,{pointerId:id,pointerType:'touch',isPrimary:primary,clientX:x,clientY:y,button:0,bubbles:true}));
async function open(s){if(f.src)await new Promise(r=>{f.onload=r;f.src='about:blank';});save(s);localStorage.setItem('crossfire-view','tabletop');await new Promise(r=>{f.onload=r;f.src='./index.html?landscape='+Date.now();});await tick();click('[data-camera="expand"]');await tick();}
function anchor(id){const el=d().querySelector(`.mini-label[data-unit="${id}"]`),r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,el};}
document.querySelector('button').onclick=async()=>{const results=[],check=(name,pass)=>{results.push({name,pass:!!pass});out.textContent=JSON.stringify(results,null,2);};try{await open(fixture());check('Landscape table fills the viewport without overflow',d().querySelector('.map-panel.expanded')&&d().documentElement.scrollWidth<=844&&Math.abs(d().querySelector('.map-viewport').getBoundingClientRect().height-390)<2);check('All six translucent menu tabs are available',d().querySelectorAll('[data-play-tab]:not(.play-drawer-close)').length===6);select('a');select('a2',true);await tick();check('Shift-click selects two friendly stands with a stable leader',d().querySelector('.play-bottom').textContent.includes('2 selected · leader a')&&d().querySelectorAll('.mini-label.selected').length===2);select('a2',true);await tick();check('Shift-click again removes a stand',d().querySelectorAll('.mini-label.selected').length===1);select('a2',true);let a=anchor('a');pointer('pointerdown',a.x,a.y,71,a.el);await pause(560);await tick();check('Holding a friendly stand opens popup orders',!!d().querySelector('.unit-popup [data-mode="fire"]'));click('[data-command="dismiss-popup"]');click('[data-command="interaction-orbit"]');const vp=()=>d().querySelector('.map-viewport'),r=vp().getBoundingClientRect(),cx=r.left+350,cy=r.top+180,beforeYaw=vp().dataset.azimuth,beforePitch=vp().dataset.pitch,beforeUnits=load().units.map(u=>[u.x,u.y]);pointer('pointerdown',cx,cy,72);pointer('pointermove',cx+55,cy+25,72);pointer('pointerup',cx+55,cy+25,72);await tick();check('Orbit drag changes yaw and pitch without moving troops',vp().dataset.azimuth!==beforeYaw&&vp().dataset.pitch!==beforePitch&&JSON.stringify(load().units.map(u=>[u.x,u.y]))===JSON.stringify(beforeUnits));const yaw=vp().dataset.azimuth;pointer('pointerdown',cx-45,cy,73,vp(),true);pointer('pointerdown',cx+45,cy,74,vp(),false);pointer('pointermove',cx+25,cy+45,74,vp(),false);pointer('pointerup',cx-45,cy,73,vp(),true);pointer('pointerup',cx+25,cy+45,74,vp(),false);await tick();check('Two-finger twist rotates the table camera',vp().dataset.azimuth!==yaw);click('[data-play-tab="camera"]');const projection=d().querySelector('[data-camera-option="projection"]');projection.value='perspective';projection.dispatchEvent(new(w().Event)('change',{bubbles:true}));await tick();check('Perspective projection is selectable in full-screen play',vp().dataset.projection==='perspective');const slider=d().querySelector('[data-camera-field="height"]');slider.value=150;slider.dispatchEvent(new(w().Event)('input',{bubbles:true}));await tick();check('Camera height adjusts without leaving the map',Number(vp().dataset.cameraHeight)===150&&!!d().querySelector('.map-panel.expanded'));click('[data-play-tab="camera"]');click('[data-command="interaction-move"]');select('b');await tick();check('Friendly selection followed by an enemy tap plans fire for the group',!!d().querySelector('.play-quick-orders [data-command="confirm"]')&&d().querySelectorAll('.mini-label.selected').length===2);const mode=d().querySelector('.play-quick-orders [data-fire-mode]');mode.value='crossfire';mode.dispatchEvent(new(w().Event)('change',{bubbles:true}));click('.play-quick-orders [data-command="confirm"]');await tick();check('PC-directed Crossfire resolves each selected shooter while staying full screen',load().lastFire?.shots.length===2&&!!d().querySelector('.map-panel.expanded'));click('[data-play-tab="log"]');check('Dice and dispatches are accessible inside the play view',d().querySelector('.play-drawer').textContent.includes('Last resolution')&&d().querySelector('.play-drawer').textContent.includes('Dispatches'));click('[data-play-tab="game"]');click('.play-menu [data-command="menu"]');check('Save/load operations open over the map without exiting play',!!d().querySelector('dialog[open]')&&!!d().querySelector('.map-panel.expanded'));click('[data-close]');await open(fixture());select('a');select('a2',true);const aa=anchor('a'),bb=anchor('b'),scale=(Number(bb.el.dataset.anchorX)-Number(aa.el.dataset.anchorX))/(800-150);pointer('pointerdown',aa.x,aa.y,75,aa.el);pointer('pointermove',aa.x+70*scale,aa.y,75);await tick();check('Dragging a selected stand previews the group route',d().querySelector('.tabletop-overlay').textContent.includes('START'));pointer('pointerup',aa.x+70*scale,aa.y,75);await tick();const moved=load();check('A drag moves every selected group member',Math.abs(moved.units.find(u=>u.id==='a').x-220)<2&&Math.abs(moved.units.find(u=>u.id==='a2').x-220)<2);click('[data-play-tab="camera"]');click('.play-menu [data-command="view"]');await tick();check('The 2D plan stays in full-screen play',!!d().querySelector('.map-panel.expanded .battle-svg'));click('[data-play-tab="roster"]');check('The order of battle is available over the map',!!d().querySelector('.play-drawer .roster-unit'));out.textContent=JSON.stringify({passed:results.filter(v=>v.pass).length,total:results.length,results},null,2);}catch(error){out.textContent+='\nERROR '+error.stack;}};
</script>
