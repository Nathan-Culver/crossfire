<!doctype html><title>Crossfire battlefield checks</title><style>body{font:14px system-ui;background:#17241f;color:#eee}button{padding:12px}iframe{width:390px;height:844px}pre{white-space:pre-wrap}</style><button id="run">Run battlefield checks</button><pre id="results">Ready</pre><iframe title="Mobile battlefield builder"></iframe><script type="module">
import * as E from './engine.js';import * as M from './battlefields.js';import {save,load} from './storage.js';
const f=document.querySelector('iframe'),out=document.querySelector('pre'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))),d=()=>f.contentDocument,w=()=>f.contentWindow,click=q=>d().querySelector(q).click(),change=(q,v)=>{const el=d().querySelector(q);el.value=v;el.dispatchEvent(new(w().Event)('change',{bubbles:true}));},button=c=>click(`[data-map-command="${c}"]`);
document.querySelector('button').onclick=async()=>{const results=[],check=(name,pass)=>{results.push({name,pass:!!pass});out.textContent=JSON.stringify(results,null,2);};try{if(f.src)await new Promise(r=>{f.onload=r;f.src='about:blank';});save(E.newGame({mode:'hotseat'}));localStorage.setItem('crossfire-view','tactical');await new Promise(r=>{f.onload=r;f.src='./index.html?maps-qa='+Date.now();});await tick();click('[data-command="menu"]');click('[data-dialog="new"]');change('[name="difficulty"]','hard');change('[name="mode"]','hotseat');click('[data-dialog="maps"]');await tick();const bounds=d().querySelector('dialog').getBoundingClientRect();check('Builder fits phone width and height',bounds.width<=390&&bounds.height<=844&&d().documentElement.scrollWidth<=390);d().querySelector('#battlefield-name').value='Touch test';click('[data-edit="add"]');await tick();const svg=()=>d().querySelector('.map-editor-svg'),points=()=>d().querySelector('.map-editor-svg [data-feature] polygon').getAttribute('points'),point=(x,y)=>new(w().DOMPoint)(x,y).matrixTransform(svg().getScreenCTM()),event=(type,x,y,node=svg())=>{const p=point(x,y);node.dispatchEvent(new(w().PointerEvent)(type,{pointerId:50,pointerType:'touch',clientX:p.x,clientY:p.y,button:0,bubbles:true}));};let before=points(),poly=d().querySelector('.map-editor-svg [data-feature] polygon');event('pointerdown',75,70,poly);event('pointermove',225,170);event('pointerup',225,170);await tick();check('Touch drag changes the terrain boundary',points()!==before&&d().querySelector('.editor-status').textContent.includes('features'));const handle=d().querySelector('[data-vertex="0"]'),cx=Number(handle.getAttribute('cx')),cy=Number(handle.getAttribute('cy'));before=points();event('pointerdown',cx,cy,handle);event('pointermove',cx-10,cy-10);event('pointerup',cx-10,cy-10);await tick();check('Touch corner handle edits a polygon',points()!==before);click('[data-edit="polygon"]');for(const [x,y]of [[500,300],[650,300],[650,450],[500,450]])
