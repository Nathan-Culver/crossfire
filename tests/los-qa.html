<!doctype html><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crossfire LOS regression</title><style>body{font:14px system-ui;background:#17241f;color:#eee}button{padding:12px}iframe{width:390px;height:844px}pre{white-space:pre-wrap}</style><button id="run">Run LOS checks</button><pre id="results">Ready</pre><iframe title="Phone LOS check"></iframe><script type="module">
import * as E from './engine.js';import {save} from './storage.js';
const f=document.querySelector('iframe'),out=document.querySelector('pre'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const stand=(id,side,x,y)=>({id,side,x,y,type:'rifle',platoon:1,facing:side?180:0,quality:'regular',bonus:0,status:'ready',hidden:false,noFire:false,nation:'german',prone:false,dead:false});
const box=(id,x,y,w,h)=>({id,name:id,type:'woods',capacity:8,points:[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]});
document.querySelector('button').onclick=async()=>{const results=[],check=(name,pass)=>results.push({name,pass:!!pass});try{for(const view of ['tabletop','tactical']){if(f.src)await new Promise(r=>{f.onload=r;f.src='about:blank';});let s=E.newGame({mode:'hotseat',seed:1});s.units=[stand('a',0,100,700),stand('b',1,600,100)];s.terrain=[box('left-screen',300,300,200,100),box('right-screen',700,300,200,100)];E.beginMove(s,['a'],{x:1100,y:700});while(E.roll(structuredClone(s),3).some(d=>d>=5))s.seed++;E.react(s,['b'],.5);save(s);localStorage.setItem('crossfire-view',view);await new Promise(r=>{f.onload=r;f.src='./index.html?los-qa='+view;});await tick();const d=()=>f.contentDocument,click=q=>d().querySelector(q).click();check(view+': historical shot line appears',d().querySelector('[data-shot-line]'));check(view+': summary explains mid-move interception',d().querySelector('.shot-summary').textContent.includes('before movement finished'));check(view+': no phone page overflow',d().documentElement.scrollWidth<=390);click('[data-command="shotline"]');await tick();check(view+': shot line toggles off',!d().querySelector('[data-shot-line]'));click('[data-command="shotfocus"]');await tick();check(view+': Find shot shows whole table and shot line',d().querySelector('.map-panel.expanded')&&d().querySelector('[data-shot-line]'));click('[data-camera="expand"]');click('[data-select="a"]');click('[data-mode="los"]');const target=d().querySelector('[data-unit="b"]');target.dispatchEvent(new(f.contentWindow.MouseEvent)('click',{bubbles:true,detail:0}));await tick();check(view+': blocked LOS line is red',d().querySelector('[data-sightline="blocked"]'));check(view+': blocking terrain is named on map',d().querySelector('.los-readout')?.textContent.includes('right-screen'));}out.textContent=JSON.stringify({passed:results.filter(v=>v.pass).length,total:results.length,results},null,2);}catch(error){out.textContent=error.stack;}};
</script>
