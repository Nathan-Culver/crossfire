<!doctype html><title>Crossfire custom variant checks</title><style>body{font:14px system-ui;background:#17241f;color:#eee}button{padding:10px}iframe{width:844px;height:390px}pre{white-space:pre-wrap}</style><button id="run">Run custom variant checks</button><pre id="results">Ready</pre><iframe title="Landscape custom variants"></iframe><script type="module">
import * as E from './engine.js';import {save,load,encode,decode}from'./storage.js';
const f=document.querySelector('iframe'),out=document.querySelector('pre'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))),d=()=>f.contentDocument,w=()=>f.contentWindow,click=q=>{const el=d().querySelector(q);if(!el)throw Error('Missing '+q);el.click();};
const u=(id,side,x,y,extra={})=>({id,side,x,y,type:'rifle',platoon:1,facing:side?180:0,quality:'regular',bonus:0,status:'ready',hidden:false,noFire:false,nation:'german',prone:false,dead:false,...extra});
function fixture(){const s=E.newGame({mode:'hotseat',seed:12,variants:{smokeSuccesses:true,rallySuccesses:true,assaultSuccesses:true}});s.terrain=[];s.units=[u('a',0,470,500),u('d',1,500,500),u('fo',0,100,100,{type:'fo',platoon:0})];s.support[0]={name:'81mm',length:3,missions:12,remaining:12};return s;}
async function open(s){if(f.src)await new Promise(r=>{f.onload=r;f.src='about:blank';});save(s);localStorage.setItem('crossfire-view','tactical');await new Promise(r=>{f.onload=r;f.src='./index.html?variants='+Date.now();});await tick();}
function select(id){d().querySelector(`[data-unit="${id}"]`).dispatchEvent(new(w().MouseEvent)('click',{detail:0,bubbles:true}));}
function point(x,y){const svg=d().querySelector('.battle-svg'),p=new(w().DOMPoint)(x,y).matrixTransform(svg.getScreenCTM()),v=d().querySelector('.map-viewport');for(const type of ['pointerdown','pointerup'])svg.dispatchEvent(new(w().PointerEvent)(type,{pointerId:22,isPrimary:true,pointerType:'touch',button:0,bubbles:true,clientX:p.x,clientY:p.y}));}
async function physical(values){click('.physical-dice summary');for(const [i,n]of values.entries())d().querySelector(`[name="die-${i}"]`).value=n;d().querySelector('#physical-dice').requestSubmit();await tick();}
async function expand(){click('[data-camera="expand"]');await tick();}
document.querySelector('#run').onclick=async()=>{const results=[],check=(name,pass)=>{results.push({name,pass:!!pass});out.textContent=JSON.stringify(results,null,2);};try{
 await open(E.newGame({mode:'hotseat'}));click('[data-command="menu"]');click('[data-dialog="new"]');check('All three custom variant setup switches default unchecked',['smokeSuccesses','rallySuccesses','assaultSuccesses'].every(k=>!d().querySelector(`[name="${k}"]`).checked));for(const k of ['smokeSuccesses','rallySuccesses','assaultSuccesses'])d().querySelector(`[name="${k}"]`).checked=true;d().querySelector('#setup').requestSubmit();await tick();check('Setup persists all three enabled switches',load().options.variants.smokeSuccesses&&load().options.variants.rallySuccesses&&load().options.variants.assaultSuccesses);
 let s=fixture();s.units[0].status='suppressed';await open(s);await expand();select('a');click('[data-play-tab="orders"]');click('.play-drawer [data-command="rally"]');await tick();check('Manual rally requests 3d6 over the full-screen map',d().querySelectorAll('#physical-dice input').length===3&&!!d().querySelector('.map-panel.expanded'));await physical([5,1,1]);check('One rally success removes exactly one level and retains initiative',load().units[0].status==='pinned'&&load().active===0);
 s=fixture();await open(s);await expand();select('fo');click('[data-play-tab="orders"]');click('.play-drawer [data-mode="smoke"]');point(400,100);click('.play-quick-orders [data-command="confirm"]');await tick();check('Manual smoke requests 3d6',d().querySelectorAll('#physical-dice input').length===3);await physical([1,2,3]);check('Zero smoke successes switches to opponent placement and passes initiative',load().active===1&&load().smokeChoice?.kind==='scatter'&&d().querySelector('.smoke-choice').textContent.includes('Red chooses'));
 point(300,200);await tick();check('Scatter preview shows observer and original-target LOS',d().querySelectorAll('[data-sightline="clear"]').length===2);click('.map-orders [data-command="confirm"]');await tick();check('Opponent smoke placement finishes on the map with one mission spent',!load().smokeChoice&&load().smoke.length===1&&load().support[0].remaining===11&&!!d().querySelector('.map-panel.expanded'));
 s=fixture();E.withDice(s,()=>[6,5,6],()=>E.smokeMission(s,'fo',{x:400,y:100},90));await open(decode(encode(s)));await expand();point(700,100);await tick();check('Loaded bonus placement allows a second visible point beyond the primary screen',!!load().smokeChoice&&!d().querySelector('.map-orders [data-command="confirm"]').disabled);click('.map-orders [data-command="confirm"]');await tick();check('Second screen uses no extra mission or initiative',load().smoke.length===2&&load().support[0].remaining===11&&load().active===0);
 s=fixture();s.units=s.units.filter(u=>u.type!=='fo');s.combat={side:0,target:'d',attackers:['a'],origins:{a:{x:400,y:500,facing:0}},surprise:false};await open(s);await expand();click('[data-play-tab="orders"]');click('.play-drawer [data-command="combat"]');await tick();check('Assault plan offers a target for each stand and fallback for either side',d().querySelectorAll('[name^="t-"]').length===2&&d().querySelectorAll('[data-fallback-side]').length===2);d().querySelector('#variant-combat-plan').requestSubmit();await tick();check('First assault stand requests three dice',d().querySelectorAll('#physical-dice input').length===3);await physical([5,1,1]);check('Defending stand receives its own three dice before either result is applied',d().querySelectorAll('#physical-dice input').length===3&&load().units[1].status==='ready');await physical([1,1,1]);check('Surviving forces retain contact and recorded simultaneous results',!!load().combat&&load().units[1].status==='pinned'&&load().lastAssault.shots.length===2);click('.play-drawer [data-command="combat"]');click('[data-fallback-side="1"]');await tick();check('Defender fallback clears contact and offers reactive fire',!load().combat&&load().pending?.kind==='fallback'&&d().querySelector('.play-drawer').textContent.includes('Reactive fire'));click('.play-drawer [data-command="decline"]');await tick();check('Fallback preserves status and passes initiative after the route completes',!load().pending&&load().active===0&&load().units[1].status==='pinned'&&load().units[1].x>500);
 out.textContent=JSON.stringify({passed:results.filter(v=>v.pass).length,total:results.length,results},null,2);
 }catch(error){out.textContent+='\nERROR '+error.stack;}};
</script>
