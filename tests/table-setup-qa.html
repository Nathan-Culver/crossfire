<!doctype html><title>Crossfire table and deployment checks</title><style>body{font:14px system-ui;background:#17241f;color:#eee}button{padding:10px}iframe{width:844px;height:390px}pre{white-space:pre-wrap}</style><button id="run">Run table / target checks</button><pre id="results">Ready</pre><iframe title="Landscape setup and targeting"></iframe><script type="module">
import * as E from './engine.js';import * as M from './battlefields.js';import {boardOf,inDeploymentZone} from './table.js';import {save,load} from './storage.js';
const f=document.querySelector('iframe'),out=document.querySelector('pre'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))),d=()=>f.contentDocument,w=()=>f.contentWindow,click=q=>d().querySelector(q).click(),change=(q,v)=>{const el=d().querySelector(q);el.value=v;el.dispatchEvent(new(w().Event)('change',{bubbles:true}));};
async function open(s){if(f.src)await new Promise(r=>{f.onload=r;f.src='about:blank';});save(s);localStorage.setItem('crossfire-view','tactical');await new Promise(r=>{f.onload=r;f.src='./index.html?table-setup='+Date.now();});await tick();}
const point=(svg,x,y)=>new(w().DOMPoint)(x,y).matrixTransform(svg.getScreenCTM()),pointer=(type,x,y,node,id=80)=>node.dispatchEvent(new(w().PointerEvent)(type,{pointerId:id,isPrimary:true,pointerType:'touch',button:0,bubbles:true,clientX:x,clientY:y}));
function fireFixture(){const s=E.newGame({mode:'hotseat',autoRoll:false,seed:1,variants:{suppressedOptional:true}});s.terrain=[];const u=(id,side,x,status='ready')=>({id,side,x,y:250,type:'rifle',platoon:1,facing:side?180:0,quality:'regular',bonus:0,status,hidden:false,noFire:false,nation:'german',prone:false,dead:false});s.units=[u('blue',0,150),u('suppressed',1,350,'suppressed'),u('ready',1,700),u('far',1,1000)];return s;}
const select=id=>d().querySelector(`[data-unit="${id}"]`).dispatchEvent(new(w().MouseEvent)('click',{detail:0,bubbles:true}));
document.querySelector('button').onclick=async()=>{const results=[],check=(name,pass)=>{results.push({name,pass:!!pass});out.textContent=JSON.stringify(results,null,2);};try{await open(E.newGame({mode:'hotseat'}));click('[data-command="menu"]');click('[data-dialog="new"]');change('[name="mode"]','hotseat');check('Optional suppressed-target variant starts unchecked',!d().querySelector('[name="suppressedOptional"]').checked);click('[data-dialog="maps"]');d().querySelector('#battlefield-name').value='Oval deployment';change('#table-shape','oval');d().querySelector('#table-width').value=1800;d().querySelector('#table-height').value=1000;click('[data-map-command="table-apply"]');await tick();check('Builder supports a different table shape and size',d().querySelector('.map-editor-svg').getAttribute('viewBox')==='0 0 1800 1000'&&d().querySelector('#table-shape').value==='oval');for(const [zone,points]of [['blue-zone',[[200,350],[600,350],[600,650],[200,650]]],['red-zone',[[1200,350],[1600,350],[1600,650],[1200,650]]]]){click(`[data-edit="${zone}"]`);for(const [x,y]of points){const p=point(d().querySelector('.map-editor-svg'),x,y);pointer('pointerdown',p.x,p.y,d().querySelector('.map-editor-svg'));}click('[data-edit="finish"]');}await tick();check('Both custom deployment zones can be drawn',d().querySelectorAll('.map-editor-svg [data-zone]').length===2);d().querySelector('#map-seed').value=1234;click('[data-map-command="generate"]');await tick();change('#map-slot','3');click('[data-map-command="save"]');await tick();const saved=M.savedBattlefields()[2].map;check('Saved maps retain shape, dimensions and drawn zones',saved.board.shape==='oval'&&saved.board.width===1800&&saved.deployment.blue.edge==='custom'&&saved.deployment.red.edge==='custom');click('[data-map-command="use"]');change('[name="deploy-blue-edge"]','north');d().querySelector('[name="deploy-blue-depth"]').value=30;change('[name="deploy-red-edge"]','south');d().querySelector('[name="deploy-red-depth"]').value=35;change('[name="deploy-first"]','1');d().querySelector('#setup').requestSubmit();await tick();check('Setup applies north/south starting edges and zone depths',load().options.deployment.blue.edge==='north'&&load().options.deployment.red.edge==='south'&&load().units.every(u=>inDeploymentZone(load(),u.side,u)));check('The tactical view uses the actual table dimensions',d().querySelector('.battle-svg').getAttribute('viewBox')==='0 0 1800 1000');click('[data-camera="expand"]');await tick();check('Deployment zones remain visible during full-screen arrangement',d().querySelectorAll('[data-deployment-zone]').length===2&&!!d().querySelector('.map-panel.expanded'));const before=load(),u=before.units.find(u=>u.side===0&&u.type==='rifle'),svg=d().querySelector('.battle-svg'),a=point(svg,u.x,u.y),b=point(svg,900,500);pointer('pointerdown',a.x,a.y,d().querySelector(`[data-unit="${u.id}"]`));pointer('pointermove',b.x,b.y,d().querySelector('.map-viewport'));pointer('pointerup',b.x,b.y,d().querySelector('.map-viewport'));await tick();check('A drop outside the assigned zone is rejected with a reason',load().units.find(v=>v.id===u.id).x===u.x&&d().querySelector('#toast').textContent.includes('zone'));click('.play-bottom [data-command="beginbattle"]');await tick();check('The chosen starting initiative is honored',load().active===1&&!load().deployment);check('Beginning battle keeps the full-screen play surface',!!d().querySelector('.map-panel.expanded'));await open(fireFixture());click('[data-camera="expand"]');await tick();select('blue');select('ready');await tick();check('A nearer suppressed enemy does not force target selection',!d().querySelector('.play-quick-orders [data-command="confirm"]').disabled);select('far');await tick();check('A nearer non-suppressed enemy still enforces proximity',d().querySelector('.play-quick-orders [data-command="confirm"]').disabled);select('ready');click('.play-quick-orders [data-command="confirm"]');await tick();check('Manual dice open over the table without leaving play',!!d().querySelector('dialog[open] [data-dice="roll"]')&&!!d().querySelector('.map-panel.expanded'));click('.physical-dice summary');for(const [i,n]of [1,2,3].entries())d().querySelector(`[name="die-${i}"]`).value=n;d().querySelector('#physical-dice').requestSubmit();await tick();check('A failed player roll passes initiative immediately in full-screen play',load().active===1&&!load().pendingDice&&!!d().querySelector('.map-panel.expanded'));check('The fired-at enemy was the chosen non-suppressed stand',load().lastFire.shots[0].targetId==='ready');out.textContent=JSON.stringify({passed:results.filter(v=>v.pass).length,total:results.length,results},null,2);}catch(error){out.textContent+='\nERROR '+error.stack;}};
</script>
