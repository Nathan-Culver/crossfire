<!doctype html><title>Crossfire interaction QA</title><style>body{font:14px system-ui;background:#14251b;color:#eee}button{padding:12px}iframe{width:390px;height:844px;border:1px solid #aaa}pre{white-space:pre-wrap}</style><button id="run">Run tabletop interaction checks</button><pre id="results">Ready</pre><iframe id="game" title="Mobile Crossfire"></iframe><script type="module">
import * as E from './engine.js';import{armyTemplate}from'./army.js';import{save,load}from'./storage.js';
const iframe=document.querySelector('iframe'),out=document.querySelector('pre');let results=[];
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const loaded=()=>new Promise(resolve=>{iframe.onload=resolve;iframe.src=`./index.html?qa=${Date.now()}`;});
document.querySelector('button').onclick=async()=>{results=[];const test=(label,pass)=>{results.push({label,pass:!!pass});out.textContent=JSON.stringify(results,null,2);};try{let s=E.newGame({mode:'hotseat',seed:100000,arrangeDeployment:true,armies:[armyTemplate('german','patrol'),armyTemplate('german','patrol')]});while(E.roll(structuredClone(s))[0]<3)s.seed++;if(iframe.src)await new Promise(r=>{iframe.onload=r;iframe.src='about:blank';});save(s);await loaded();await tick();const doc=()=>iframe.contentDocument,win=()=>iframe.contentWindow,vp=()=>doc().querySelector('.map-viewport'),select=id=>doc().querySelector(`.roster-unit[data-select="${id}"]`).click(),pointer=(type,id,x,y,node=vp())=>node.dispatchEvent(new(win().PointerEvent)(type,{bubbles:true,pointerId:id,pointerType:'touch',clientX:x,clientY:y,button:0})),button=c=>doc().querySelector(`[data-command="${c}"]`),control=c=>doc().querySelector(`[data-camera="${c}"]`),get=()=>load();let u=get().units.find(u=>u.side===0&&u.type==='rifle'),id=u.id;
function anchor(id){const e=doc().querySelector(`.mini-label[data-unit="${id}"]`),r=e.getBoundingClientRect();const v=vp().getBoundingClientRect(),m=e.style.transform.match(/translate\(([-.\d]+)px,\s*([-.\d]+)px\)/);return{x:r.left+r.width/2,y:r.top+r.height/2,wx:v.left+Number(e.dataset.anchorX??m[1]),wy:v.top+Number(e.dataset.anchorY??m[2]),e};}
function scale(){const us=get().units.filter(v=>v.side===0&&v.type==='rifle'),a=anchor(us[0].id),b=anchor(us[1].id),c=anchor(us[2].id);return{x:(b.wx-a.wx)/(us[1].x-us[0].x),y:(c.wy-a.wy)/(us[2].y-us[0].y)};}
async function drag(dx,dy,hold=false){const a=anchor(id),k=scale(),x=a.x+dx*k.x,y=a.y+dy*k.y;pointer('pointerdown',90,a.x,a.y,a.e);pointer('pointermove',90,x,y);await tick();if(hold){test('Live drag shows origin-to-current route',doc().querySelector('.tabletop-overlay').textContent.includes('START'));test('Preview does not move game state before release',get().units.find(v=>v.id===id).x===u.x);}pointer('pointerup',90,x,y);await tick();}
 test('Phone page has no horizontal overflow',doc().documentElement.scrollWidth<=390);test('3D scene is active',vp().dataset.renderer==='software-3d'||vp().dataset.renderer==='webgl');await drag(-30,0,true);test('Drop repositions a stand during deployment',Math.abs(get().units.find(v=>v.id===id).x-(u.x-30))<1);u=get().units.find(v=>v.id===id);
 const r=vp().getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,oldCenter=vp().dataset.centerX;pointer('pointerdown',91,cx,cy);pointer('pointermove',91,cx-30,cy-15);pointer('pointerup',91,cx-30,cy-15);await tick();test('Empty-ground drag pans camera',vp().dataset.centerX!==oldCenter);control('fit').click();await tick();
 const a1=get().units.find(v=>v.id===id),x1=a1.x,y1=a1.y;pointer('pointerdown',92,cx-30,cy);pointer('pointerdown',93,cx+30,cy);pointer('pointermove',92,cx-60,cy);pointer('pointermove',93,cx+60,cy);pointer('pointerup',92,cx-60,cy);pointer('pointerup',93,cx+60,cy);await tick();test('Two touch pointers pinch to zoom',Number(vp().dataset.scale)>1.5);test('Pinch never moves a troop',get().units.find(v=>v.id===id).x===x1&&get().units.find(v=>v.id===id).y===y1);control('fit').click();await tick();
 button('panmode').click();await tick();const before=vp().dataset.centerX;await drag(30,0);test('Pan mode drags camera from a stand',vp().dataset.centerX!==before&&get().units.find(v=>v.id===id).x===x1);button('panmode').click();control('fit').click();await tick();button('beginbattle').click();await tick();
 u=get().units.find(v=>v.id===id);await drag(850,0);test('Illegal move snaps back and explains why',Math.abs(get().units.find(v=>v.id===id).x-u.x)<1&&doc().querySelector('#toast').textContent.length>0);control('focus').click();await tick();await drag(8,0);test('Legal battle drop commits a movement trail',get().lastMoves.some(m=>m.id===id));
 button('referee').click();doc().querySelector('[data-marker="pinned"]').click();await tick();u=get().units.find(v=>v.id===id);await drag(10,0);test('Pinned stand cannot be dragged to move',get().units.find(v=>v.id===id).x===u.x);test('Pinned reason appears in movement guidance',doc().querySelector('.movement-coach').textContent.includes('Rally'));
 doc().querySelector('[data-marker="ready"]').click();doc().querySelector('[data-marker="noFire"]').click();await tick();test('Manual NO FIRE marker is visible',doc().querySelector(`[data-unit="${id}"] .nofire`)?.textContent==='NO FIRE');
 control('fit').click();await tick();const fo=get().units.find(v=>v.side===0&&v.type==='fo');select(fo.id);await tick();doc().querySelector('[data-mode="smoke"]').click();await tick();const ar=anchor(fo.id),k=scale(),px=ar.wx+60*k.x,py=ar.wy+33*Math.sin(1.04)*k.x;pointer('pointerdown',94,px,py);pointer('pointerup',94,px,py);await tick();button('confirm').click();await tick();test('FO smoke mission places a saved screen and spends a mission',get().smoke.length===1&&get().support[0].remaining===11);button('pass').click();await tick();test('Smoke lasts through the enemy initiative',get().smoke.length===1);button('pass').click();await tick();test('Smoke lifts on its owner’s next initiative',get().smoke.length===0);test('NO FIRE clears when initiative changes',!get().units.find(v=>v.id===id).noFire);
 doc().querySelector('[data-help="drag"]').click();await tick();const dr=doc().querySelector('dialog').getBoundingClientRect();test('Movement help fits the phone viewport',dr.width<=390&&dr.height<=844);doc().querySelector('[data-close]').click();out.textContent=JSON.stringify({passed:results.filter(r=>r.pass).length,total:results.length,results},null,2);
 }catch(error){out.textContent+='\nERROR: '+error.stack;}};
</script>
