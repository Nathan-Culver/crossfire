<!doctype html><title>Crossfire player dice checks</title><style>body{background:#17241f;color:#eee;font:14px system-ui}button{padding:12px}iframe{width:390px;height:844px}pre{white-space:pre-wrap}</style><button id="run">Run player dice checks</button><pre id="results">Ready</pre><iframe title="Phone dice check"></iframe><script type="module">
import * as E from './engine.js';import {save,load} from './storage.js';
const f=document.querySelector('iframe'),out=document.querySelector('pre'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const stand=(id,side,x,y)=>({id,side,x,y,type:'rifle',platoon:1,facing:side?180:0,quality:'regular',bonus:0,status:'ready',hidden:false,noFire:false,nation:'german',prone:false,dead:false});
function fixture(){const s=E.newGame({mode:'hotseat',seed:1});s.units=[stand('a',0,100,100),stand('b',1,500,100)];s.terrain=[];return s;}
async function open(s){if(f.src)await new Promise(r=>{f.onload=r;f.src='about:blank';});if(s)save(s);await new Promise(r=>{f.onload=r;f.src='./index.html?dice-qa='+Date.now();});await tick();}
const d=()=>f.contentDocument,click=q=>d().querySelector(q).click();
let coached=true;function plan(){click('[data-select="a"]');coached&&=!!d().querySelector('.map-orders [data-mode="fire"]');click('.map-orders [data-mode="fire"]');coached&&=!!d().querySelector('.map-orders [data-select="b"]')&&!!d().querySelector('[data-fire-eligible="b"],.fire-eligible[data-unit="b"]');click('.map-orders [data-select="b"]');click('.map-orders [data-command="confirm"]');}
document.querySelector('button').onclick=async()=>{const results=[],check=(name,pass)=>results.push({name,pass:!!pass});try{localStorage.setItem('crossfire-view',new URL(location.href).searchParams.get('view')||'tactical');await open(fixture());plan();await tick();check('Auto-roll off opens a 3d6 player prompt',d().querySelector('dialog[open] h2').textContent.includes('3d6'));check('Awaiting roll leaves battlefield unchanged',load().actions===0&&load().units[1].status==='ready');const r=d().querySelector('dialog').getBoundingClientRect();check('Roll dialog fits phone viewport',r.width<=390&&r.height<=844);click('[data-dice="cancel"]');check('Cancel before rolling leaves no pending transaction',!load().pendingDice&&!d().querySelector('dialog[open]'));plan();click('.physical-dice summary');for(const [i,n]of [5,6,1].entries())d().querySelector(`[name="die-${i}"]`).value=n;d().querySelector('#physical-dice').requestSubmit();await tick();check('Physical faces are recorded and displayed',load().pendingDice.rolls[0].dice.join(',')==='5,6,1'&&d().querySelector('.player-dice').textContent==='561');click('[data-close]');check('Recorded results cannot be discarded with Close',!!d().querySelector('dialog[open]')&&load().pendingDice.rolls.length===1);await open();check('Reload resolves the recorded result exactly once',load().actions===1&&load().units[1].status==='suppressed'&&!load().pendingDice&&load().lastFire.shots[0].dice.join(',')==='5,6,1');click('[data-command="menu"]');check('Operations exposes auto-roll on/off',!!d().querySelector('#auto-roll')&&!d().querySelector('#auto-roll').checked);click('#auto-roll');check('Auto-roll setting is saved',load().options.autoRoll===true);click('[data-close]');plan();await tick();check('Auto-roll on resolves without a player prompt',!d().querySelector('dialog[open]')&&load().actions===2&&!load().pendingDice);await open(fixture());plan();click('[data-dice="roll"]');await tick();check('Roll dice button displays and saves all faces',load().pendingDice.rolls[0].dice.length===3&&d().querySelectorAll('.player-dice .die').length===3);click('[data-dice="continue"]');await tick();check('Continue commits the action once',load().actions===1&&!load().pendingDice);check('Fire, highlighted eligible target, and Open fire work beside the map',coached);out.textContent=JSON.stringify({passed:results.filter(v=>v.pass).length,total:results.length,results},null,2);}catch(error){out.textContent=error.stack;}};
</script>
