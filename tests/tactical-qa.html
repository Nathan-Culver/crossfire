<!doctype html><title>Crossfire tactical-board checks</title><button id="run">Run 2D drag checks</button><pre id="result">Ready</pre><iframe id="game" title="Tactical phone board" style="width:390px;height:844px"></iframe><script type="module">import * as E from'./engine.js';import{armyTemplate}from'./army.js';import{save,load}from'./storage.js';const f=document.querySelector('iframe'),out=document.querySelector('pre'),tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));document.querySelector('button').onclick=async()=>{try{const results=[],check=(name,pass)=>results.push({name,pass});if(f.src)await new Promise(r=>{f.onload=r;f.src='about:blank';});localStorage.setItem('crossfire-view','tactical');save(E.newGame({mode:'hotseat',arrangeDeployment:true,armies:[armyTemplate('german','patrol'),armyTemplate('german','patrol')]}));await new Promise(r=>{f.onload=r;f.src='./index.html?tactical-qa=1';});await tick();const d=()=>f.contentDocument,w=()=>f.contentWindow,vp=()=>d().querySelector('.map-viewport'),get=()=>load(),u=get().units.find(u=>u.side===0&&u.type==='rifle'),id=u.id,point=(x,y)=>new(w().DOMPoint)(x,y).matrixTransform(d().querySelector('.battle-svg').getScreenCTM()),event=(type,x,y,node=vp())=>node.dispatchEvent(new(w().PointerEvent)(type,{pointerId:70,pointerType:'touch',button:0,bubbles:true,clientX:x,clientY:y}));let a=point(u.x,u.y),b=point(u.x-30,u.y);event('pointerdown',a.x,a.y,d().querySelector(`[data-unit="${id}"]`));event('pointermove',b.x,b.y);await tick();check('2D drag draws its route',!!d().querySelector('[data-live-drag] line'));event('pointerup',b.x,b.y);await tick();check('2D drop changes deployment position',Math.abs(get().units.find(v=>v.id===id).x-(u.x-30))<1);d().querySelector('[data-command="beginbattle"]').click();d().querySelector('[data-camera="focus"]').click();await tick();let v=get().units.find(v=>v.id===id);a=point(v.x,v.y);b=point(v.x+12,v.y);event('pointerdown',a.x,a.y,d().querySelector(`[data-unit="${id}"]`));event('pointermove',b.x,b.y);event('pointerup',b.x,b.y);await tick();check('2D battle drag creates an actual movement trail',get().lastMoves.some(m=>m.id===id));d().querySelector('[data-command="panmode"]').click();await tick();v=get().units.find(v=>v.id===id);const before=d().querySelector('.battle-stage').style.transform;a=point(v.x,v.y);event('pointerdown',a.x,a.y,d().querySelector(`[data-unit="${id}"]`));event('pointermove',a.x-30,a.y);event('pointerup',a.x-30,a.y);await tick();check('2D Pan mode pans without moving a stand',d().querySelector('.battle-stage').style.transform!==before&&get().units.find(m=>m.id===id).x===v.x);out.textContent=JSON.stringify({passed:results.filter(x=>x.pass).length,total:results.length,results},null,2);}catch(e){out.textContent=e.stack;}};</script>
